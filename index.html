<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fala Fácil - Comunicação Acessível</title>
    <style>
        /* Reset e Estilos Globais de Acessibilidade */
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: #121212; /* Fundo escuro para reduzir fadiga ocular */
            color: #FFFFFF;
            display: flex;
            flex-direction: column;
            min-height: 100vh;
            padding: 20px;
            user-select: none; /* Evita seleção acidental de texto */
        }

        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            border-bottom: 2px solid #333;
            padding-bottom: 15px;
        }

        h1 {
            font-size: 2rem;
            color: #FFD700; /* Amarelo Ouro - Alto contraste */
        }

        /* Botão de Configurações (Para familiares) */
        .btn-config {
            background-color: #333;
            color: #FFF;
            border: 2px solid #FFF;
            padding: 10px 15px;
            font-size: 1.1rem;
            border-radius: 10px;
            cursor: pointer;
        }

        /* Área Principal */
        main {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
            gap: 25px;
        }

        /* Visor de Status Gigante */
        #status-visor {
            background-color: #1E1E1E;
            border: 3px solid #FFD700;
            border-radius: 20px;
            padding: 25px;
            width: 100%;
            max-width: 600px;
            min-height: 140px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
        }

        #status-texto {
            font-size: 1.8rem;
            font-weight: bold;
            line-height: 1.4;
        }

        #sub-status {
            font-size: 1.3rem;
            color: #BBBBBB;
            margin-top: 10px;
        }

        /* Botão Gigante de Microfone */
        #btn-falar {
            background-color: #00E676; /* Verde vibrante */
            color: #000000;
            border: none;
            border-radius: 50%;
            width: 220px;
            height: 220px;
            font-size: 2rem;
            font-weight: 900;
            cursor: pointer;
            box-shadow: 0 10px 25px rgba(0, 230, 118, 0.4);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            transition: transform 0.2s, background-color 0.2s;
        }

        #btn-falar:active {
            transform: scale(0.95);
        }

        #btn-falar.ouvindo {
            background-color: #FF3D00; /* Vermelho/Laranja quando está gravando */
            color: #FFFFFF;
            animation: pulsar 1.5s infinite;
        }

        .icone-mic {
            font-size: 4.5rem;
            margin-bottom: 5px;
        }

        @keyframes pulsar {
            0% { box-shadow: 0 0 0 0 rgba(255, 61, 0, 0.7); }
            70% { box-shadow: 0 0 0 30px rgba(255, 61, 0, 0); }
            100% { box-shadow: 0 0 0 0 rgba(255, 61, 0, 0); }
        }

        /* Botões de Ação Rápida (Aparecem após reconhecer o nome) */
        #acoes-contato {
            display: none; /* Oculto inicialmente */
            flex-direction: column;
            gap: 15px;
            width: 100%;
            max-width: 600px;
        }

        .btn-acao {
            padding: 25px;
            font-size: 1.8rem;
            font-weight: bold;
            border: none;
            border-radius: 15px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 15px;
        }

        .btn-ligar {
            background-color: #2979FF;
            color: white;
        }

        .btn-whatsapp {
            background-color: #25D366;
            color: black;
        }

        .btn-cancelar {
            background-color: #D50000;
            color: white;
            font-size: 1.4rem;
            padding: 15px;
        }

        /* Tela de Cadastro de Contatos (Modal) */
        #modal-contatos {
            display: none;
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background-color: rgba(0,0,0,0.95);
            padding: 20px;
            overflow-y: auto;
            z-index: 100;
        }

        .modal-conteudo {
            max-width: 600px;
            margin: 0 auto;
            background: #1E1E1E;
            padding: 25px;
            border-radius: 15px;
            border: 2px solid #FFD700;
        }

        .form-grupo {
            margin-bottom: 15px;
            text-align: left;
        }

        .form-grupo label {
            display: block;
            font-size: 1.2rem;
            margin-bottom: 5px;
            color: #FFD700;
        }

        .form-grupo input {
            width: 100%;
            padding: 15px;
            font-size: 1.3rem;
            border-radius: 8px;
            border: none;
        }

        .btn-salvar {
            background-color: #00E676;
            color: black;
            font-weight: bold;
            padding: 15px;
            width: 100%;
            font-size: 1.4rem;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            margin-top: 10px;
        }

        .lista-contatos {
            margin-top: 25px;
            text-align: left;
        }

        .item-contato {
            background: #333;
            padding: 15px;
            border-radius: 8px;
            margin-bottom: 10px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 1.2rem;
        }

        .btn-excluir {
            background: #FF3D00;
            color: white;
            border: none;
            padding: 8px 12px;
            border-radius: 5px;
            font-size: 1rem;
            cursor: pointer;
        }
    </style>
</head>
<body>

    <header>
        <h1>Fala Fácil</h1>
        <button class="btn-config" onclick="abrirModal()">⚙️ Contatos</button>
    </header>

    <main>
        <!-- Visor com letras gigantes -->
        <div id="status-visor">
            <div id="status-texto">Toque no botão verde e diga o nome da pessoa.</div>
            <div id="sub-status">Ex: "Filha", "Médico", "João"</div>
        </div>

        <!-- Botão Principal -->
        <button id="btn-falar" onclick="iniciarReconhecimento()">
            <span class="icone-mic">🎤</span>
            <span>FALAR</span>
        </button>

        <!-- Botões que aparecem quando o contato é encontrado -->
        <div id="acoes-contato">
            <button id="link-ligar" class="btn-acao btn-ligar">📞 LIGAR AGORA</button>
            <button id="link-whatsapp" class="btn-acao btn-whatsapp">💬 MANDAR WHATSAPP</button>
            <button class="btn-acao btn-cancelar" onclick="resetarTela()">❌ Cancelar / Falar outro nome</button>
        </div>
    </main>

    <!-- Modal para Cadastrar Contatos -->
    <div id="modal-contatos">
        <div class="modal-conteudo">
            <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px;">
                <h2 style="color: #FFD700;">Agenda Simplificada</h2>
                <button class="btn-config" onclick="fecharModal()">Fechar ✖</button>
            </div>

            <div class="form-grupo">
                <label>Como o idoso chama essa pessoa? (Ex: Filho, Maria, Médico)</label>
                <input type="text" id="input-nome" placeholder="Digite o nome ou apelido">
            </div>

            <div class="form-grupo">
                <label>Número com DDD (apenas números, Ex: 11999998888)</label>
                <input type="tel" id="input-telefone" placeholder="Ex: 11988887777">
            </div>

            <button class="btn-salvar" onclick="salvarContato()">💾 Salvar Contato</button>

            <div class="lista-contatos" id="lista-contatos-salvos">
                <!-- Lista renderizada via JS -->
            </div>
        </div>
    </div>

    <script>
        // ==========================================
        // 1. BANCO DE DADOS LOCAL (LocalStorage)
        // ==========================================
        // Contatos iniciais de exemplo
        let contatos = JSON.parse(localStorage.getItem('contatosIdoso')) || [
            { nome: 'Filha', telefone: '11999999999' },
            { nome: 'Médico', telefone: '11988888888' },
            { nome: 'Emergência', telefone: '192' }
        ];

        function salvarNoStorage() {
            localStorage.setItem('contatosIdoso', JSON.stringify(contatos));
            renderizarContatos();
        }

        // ==========================================
        // 2. SÍNTESE DE VOZ (O App fala com o idoso)
        // ==========================================
        function falarEmVozAlta(texto) {
            if ('speechSynthesis' in window) {
                window.speechSynthesis.cancel(); // Para qualquer fala anterior
                const mensagem = new SpeechSynthesisUtterance(texto);
                mensagem.lang = 'pt-BR';
                mensagem.rate = 0.9; // Fala um pouco mais devagar para melhor compreensão
                mensagem.pitch = 1.0;
                window.speechSynthesis.speak(mensagem);
            }
        }

        // ==========================================
        // 3. RECONHECIMENTO DE VOZ (O App ouve o idoso)
        // ==========================================
        const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
        let recognition;

        if (SpeechRecognition) {
            recognition = new SpeechRecognition();
            recognition.lang = 'pt-BR';
            recognition.continuous = false; // Para de ouvir assim que a pessoa termina a frase
            recognition.interimResults = false;

            recognition.onstart = function() {
                const btn = document.getElementById('btn-falar');
                btn.classList.add('ouvindo');
                btn.innerHTML = '<span class="icone-mic">👂</span><span>OUVINDO...</span>';
                document.getElementById('status-texto').innerText = "Pode falar o nome agora...";
                document.getElementById('sub-status').innerText = "";
            };

            recognition.onresult = function(event) {
                const textoFalado = event.results[0][0].transcript;
                processarComando(textoFalado);
            };

            recognition.onerror = function(event) {
                resetarBotaoMic();
                let msgErro = "Não consegui ouvir. Tente novamente.";
                if(event.error === 'not-allowed') {
                    msgErro = "Por favor, permita o uso do microfone no navegador.";
                }
                document.getElementById('status-texto').innerText = msgErro;
                falarEmVozAlta(msgErro);
            };

            recognition.onend = function() {
                resetarBotaoMic();
            };
        } else {
            alert("Seu navegador não suporta reconhecimento de voz. Por favor, use o Google Chrome.");
        }

        function iniciarReconhecimento() {
            if (recognition) {
                window.speechSynthesis.cancel();
                recognition.start();
            }
        }

        function resetarBotaoMic() {
            const btn = document.getElementById('btn-falar');
            btn.classList.remove('ouvindo');
            btn.innerHTML = '<span class="icone-mic">🎤</span><span>FALAR</span>';
        }

        // ==========================================
        // 4. PROCESSAMENTO DO COMANDO
        // ==========================================
        function removerAcentos(texto) {
            return texto.normalize("NFD").replace(/[\u0300-\u036f]/g, "").toLowerCase();
        }

        function processarComando(fraseFalada) {
            const fraseLimpa = removerAcentos(fraseFalada);
            document.getElementById('sub-status').innerText = `Você disse: "${fraseFalada}"`;

            // Procura se algum nome salvo está dentro da frase falada
            // Ex: Se o idoso disser "Quero falar com a Filha", ele encontra "Filha"
            const contatoEncontrado = contatos.find(c => 
                fraseLimpa.includes(removerAcentos(c.nome))
            );

            if (contatoEncontrado) {
                exibirOpcoesContato(contatoEncontrado);
            } else {
                const msg = `Não encontrei ninguém chamado "${fraseFalada}". Tente falar novamente.`;
                document.getElementById('status-texto').innerText = msg;
                falarEmVozAlta(msg);
            }
        }

        function exibirOpcoesContato(contato) {
            // Esconde o botão do microfone e mostra os botões grandes de ação
            document.getElementById('btn-falar').style.display = 'none';
            const divAcoes = document.getElementById('acoes-contato');
            divAcoes.style.display = 'flex';

            const msg = `Encontrei ${contato.nome}. Você quer ligar ou mandar WhatsApp?`;
            document.getElementById('status-texto').innerText = `Contato: ${contato.nome}`;
            falarEmVozAlta(msg);

            // Configura o botão de Ligação Telefônica nativa
            const btnLigar = document.getElementById('link-ligar');
            btnLigar.onclick = function() {
                falarEmVozAlta(`Ligando para ${contato.nome}`);
                window.location.href = `tel:${contato.telefone}`;
            };

            // Configura o botão do WhatsApp (abre direto na conversa)
            const btnWhats = document.getElementById('link-whatsapp');
            btnWhats.onclick = function() {
                falarEmVozAlta(`Abrindo WhatsApp de ${contato.nome}`);
                // Adiciona o código do Brasil (55) se não tiver
                let num = contato.telefone.replace(/\D/g, '');
                if (num.length <= 11) num = '55' + num;
                window.open(`https://wa.me/${num}`, '_blank');
            };
        }

        function resetarTela() {
            document.getElementById('acoes-contato').style.display = 'none';
            document.getElementById('btn-falar').style.display = 'flex';
            document.getElementById('status-texto').innerText = "Toque no botão verde e diga o nome da pessoa.";
            document.getElementById('sub-status').innerText = "";
            falarEmVozAlta("Toque no botão verde para falar.");
        }

        // ==========================================
        // 5. GERENCIAMENTO DA AGENDA (Para Familiares)
        // ==========================================
        function abrirModal() {
            renderizarContatos();
            document.getElementById('modal-contatos').style.display = 'block';
        }

        function fecharModal() {
            document.getElementById('modal-contatos').style.display = 'none';
        }

        function salvarContato() {
            const nome = document.getElementById('input-nome').value.trim();
            const telefone = document.getElementById('input-telefone').value.trim();

            if (!nome || !telefone) {
                alert("Preencha o nome e o telefone!");
                return;
            }

            contatos.push({ nome, telefone });
            salvarNoStorage();

            document.getElementById('input-nome').value = '';
            document.getElementById('input-telefone').value = '';
        }

        function excluirContato(index) {
            contatos.splice(index, 1);
            salvarNoStorage();
        }

        function renderizarContatos() {
            const lista = document.getElementById('lista-contatos-salvos');
            lista.innerHTML = '<h3 style="margin-bottom:10px; color:#FFF;">Contatos Salvos:</h3>';

            contatos.forEach((contato, index) => {
                lista.innerHTML += `
                    <div class="item-contato">
                        <div>
                            <strong>${contato.nome}</strong><br>
                            <small style="color:#BBB">${contato.telefone}</small>
                        </div>
                        <button class="btn-excluir" onclick="excluirContato(${index})">Apagar</button>
                    </div>
                `;
            });
        }
    </script>
</body>
</html>
